<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>自动点赞</title>
<style>
  body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f6f8;margin:0;padding:20px;color:#1b2432}
  .card{background:#fff;border:1px solid #e1e6ed;border-radius:10px;padding:18px 20px;max-width:640px;margin:0 auto 16px}
  h1{font-size:18px;margin:0 0 14px}
  label{display:block;font-size:13px;color:#5c6675;margin:12px 0 4px}
  textarea,input[type=number]{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #d5dbe3;border-radius:7px;font-size:14px;font-family:inherit}
  .row{display:flex;align-items:center;gap:8px;margin:12px 0}
  .row label{margin:0}
  button{background:#2456d6;color:#fff;border:none;border-radius:7px;padding:9px 18px;font-size:14px;cursor:pointer;margin-top:14px}
  #msg{margin-top:12px;font-size:13px;color:#0e9488}
</style>
</head>
<body>
<div class="card">
  <h1>自动点赞</h1>
  <div class="row"><input type="checkbox" id="enabled" style="width:auto" /><label for="enabled">启用自动点赞（每日执行）</label></div>
  <label>模式</label>
  <select id="mode">
    <option value="all">全部好友</option>
    <option value="specific">特定名单</option>
  </select>
  <label>点赞次数</label>
  <input type="number" id="times" min="1" max="20" />
  <label>特定名单 QQ（每行一个）</label>
  <textarea id="users" placeholder="10001&#10;10002"></textarea>
  <button id="save">保存</button>
  <div id="msg"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>

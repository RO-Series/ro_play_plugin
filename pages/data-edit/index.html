<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>数据编辑</title>
<style>
  body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f6f8;margin:0;padding:20px;color:#1b2432}
  .card{background:#fff;border:1px solid #e1e6ed;border-radius:10px;padding:18px 20px;max-width:640px;margin:0 auto 16px}
  h1{font-size:18px;margin:0 0 14px}
  label{display:block;font-size:13px;color:#5c6675;margin:12px 0 4px}
  input[type=text],input[type=number]{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #d5dbe3;border-radius:7px;font-size:14px}
  button{background:#2456d6;color:#fff;border:none;border-radius:7px;padding:9px 18px;font-size:14px;cursor:pointer;margin-top:14px}
  button.secondary{background:#eef1f6;color:#1b2432}
  #msg{margin-top:12px;font-size:13px;color:#0e9488}
</style>
</head>
<body>
<div class="card">
  <h1>玩家数据编辑</h1>
  <label>玩家 QQ 号</label>
  <input type="text" id="uid" placeholder="10001" />
  <label>归笺</label>
  <input type="number" id="money" value="0" />
  <label>诱饵</label>
  <input type="number" id="bait" value="0" />
  <label>银行存款</label>
  <input type="number" id="bank" value="0" />
  <div>
    <button class="secondary" id="load">加载数据</button>
    <button id="save" style="margin-left:8px">保存数据</button>
  </div>
  <div id="msg"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
